# Github UI name
name: CI 

on:
  push:
    branches: ["*"]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code               
        uses: actions/checkout@v4

      - name: Set up Python 3.11          
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev tools          
        run: pip install -r requirements.txt

      - name: Lint with ruff            
        run: ruff check .

      - name: Check formatting with black 
        run: black --check .
